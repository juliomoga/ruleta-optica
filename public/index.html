<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Ruleta de premios</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:60px auto;padding:0 20px;color:#111;background:#fff}a{display:block;padding:16px;border:2px solid #ddd;border-radius:12px;margin:12px 0;text-decoration:none;color:#111;font-weight:700}a small{display:block;font-weight:400;color:#666}img{max-width:240px;max-height:80px}#aviso{background:#fdecec;color:#a4121a;padding:12px 16px;border-radius:12px;font-weight:600}</style></head>
<body><div id="marca"><h1>Ruleta de premios</h1></div>
<p id="aviso" hidden></p>
<a href="/pantalla">Pantalla<small>La rueda grande: ábrela en la tele o la pantalla del escaparate</small></a>
<a href="/tablet">Tablet<small>Registro y botón de girar (iPad o tablet en la puerta)</small></a>
<a href="/admin">Panel<small>Ajustes, premios, participantes, sorteo final</small></a>
<script>
fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) {
  if (c.error) { var a = document.getElementById('aviso'); a.hidden = false; a.textContent = '⚠️ ' + c.mensaje; return; }
  var m = c.marca, h = document.getElementById('marca');
  h.innerHTML = (m.logo_largo ? '<img src="' + m.logo_largo + '" alt="">' : '') + '<h1></h1>';
  h.querySelector('h1').textContent = (m.titulo || 'Ruleta de premios') + (m.logo_largo ? '' : ' · ' + m.nombre);
}).catch(function () {});
</script>
</body></html>
